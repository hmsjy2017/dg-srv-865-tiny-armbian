name: Build Armbian (Debian 13 minimal)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update && sudo apt-get install -y mkbootimg || true
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg
          sudo cp -f /tmp/mkbootimg/mkbootimg.py /usr/bin/mkbootimg
          sudo cp -rf /tmp/mkbootimg/gki /usr/bin/
          sudo chmod +x /usr/bin/mkbootimg

      - run: git clone --depth 1 https://github.com/armbian/build armbian-build

      - run: |
          cd armbian-build
          ./compile.sh \
            BOARD="dg-svr-865-tiny" \
            RELEASE="trixie" \
            BUILD_MINIMAL="yes" \
            BUILD_DESKTOP="no" \
            PREFER_DOCKER="no" \
            EXPERT="yes" \
            IGNORE_UPDATES="yes" \
            KERNEL_CONFIGURE="no"

      - uses: actions/upload-artifact@v4
        with:
          name: armbian-image
          path: armbian-build/output/images/*.img*

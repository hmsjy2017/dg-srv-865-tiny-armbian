name: Build Armbian (Debian 13 minimal)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/armbian/docker-armbian-build:armbian-debian-trixie-latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Clone Armbian Build Framework
        run: git clone --depth 1 https://github.com/armbian/build armbian-build

      - name: Compile Image
        run: |
          cd armbian-build
          ./compile.sh \
            BOARD="dg-svr-865-tiny" \
            RELEASE="trixie" \
            BUILD_MINIMAL="yes" \
            BUILD_DESKTOP="no" \
            PREFER_DOCKER="no" \
            EXPERT="yes" \
            IGNORE_UPDATES="yes"

      - name: Fix Permissions
        if: always()
        run: chown -R 1001:1001 .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armbian-trixie-image
          path: armbian-build/output/images/*.img*

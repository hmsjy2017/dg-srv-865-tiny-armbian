name: Build Armbian (Debian 13 minimal)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Inject Official AOSP mkbootimg
        run: |
          sudo apt-get update && sudo apt-get install -y mkbootimg || true
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg
          sudo cp -f /tmp/mkbootimg/mkbootimg.py /usr/bin/mkbootimg
          sudo cp -rf /tmp/mkbootimg/gki /usr/bin/
          sudo chmod +x /usr/bin/mkbootimg

      - uses: actions/checkout@v4

      - uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_board: "dg-svr-865-tiny"
          armbian_release: "trixie"
          armbian_target: "build"
          armbian_ui: "minimal"
          armbian_runner_clean: "yes"

      - uses: actions/upload-artifact@v4
        with:
          name: armbian-image
          path: output/images/*.img*
